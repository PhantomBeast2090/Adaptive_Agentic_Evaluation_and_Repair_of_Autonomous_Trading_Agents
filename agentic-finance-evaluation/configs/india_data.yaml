# Indian data foundation configuration.
# Coverage and experiment dates are intentionally not specified here. They must
# be derived after actual acquisition, quality, availability, and leakage audits.
dataset_family: indian_multi_asset
active: true
raw_root: data/raw/india
processed_root: data/processed/india
manifest_root: data/manifests/india
required_datasets:
  - nse_nifty_50_daily
  - nse_nifty_500_daily
  - nse_india_vix_daily
  - rbi_gsec_10y_yield
  - rbi_tbill_91d
  - rbi_tbill_364d
  - rbi_usd_inr_daily
  - mcx_gold_futures_individual_contracts
  - mospi_cpi_combined_monthly
  - mospi_iip_general_monthly
  - rbi_policy_rate_events
calendar:
  source: NSE
  artifact: data/raw/india/indices/nse_trading_holidays_2026.json
  required_before_experiments: true
splits:
  status: pending_coverage_audit
  freeze_dates: false
