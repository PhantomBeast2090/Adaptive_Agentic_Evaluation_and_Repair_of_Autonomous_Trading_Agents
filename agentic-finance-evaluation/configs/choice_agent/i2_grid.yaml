# I2 pre-registered support-construction family specification (frozen before execution)
#
# I2 is the LAST support-construction experiment. Candidate family K0..K3 is
# complete and closed: no new cells outside already-registered I1 values, no
# new agent rules, no new ML model, no threshold relaxation, no split
# movement. Selection uses behavioural/support statistics ONLY (action
# classes, dates, regimes, instruments); outcome labels (MAE, forward
# returns, PnL, failure labels, mined conditions) must not be computed or
# consulted before the winner freeze (I2d).
experiment: I2-20260928
framing: outcome-blind support construction; last support experiment, not a new loop
agent: {module: agents.choice.multi_asset.MultiAssetChoice, policy_version: "1.1", base_params: configs/choice_agent/g1.yaml}
# Registered value sets (identical to I1 spec; NOTHING new):
#   vix_low {12.0, 15.0, 18.0}, vix_high {22.0, 25.0, 28.0}, trend_min {-0.05, -0.03}
# Full factorial = 18 combos. I1 ran 6 (C0..C5). K1 adds the other 12
# (C06..C17, lexicographic by (vix_low, vix_high, trend_min)).
i1_cells:
  - {id: C0, vix_low: 15.0, vix_high: 25.0, trend_min: -0.05}
  - {id: C1, vix_low: 12.0, vix_high: 25.0, trend_min: -0.05}
  - {id: C2, vix_low: 18.0, vix_high: 25.0, trend_min: -0.05}
  - {id: C3, vix_low: 15.0, vix_high: 22.0, trend_min: -0.05}
  - {id: C4, vix_low: 15.0, vix_high: 28.0, trend_min: -0.05}
  - {id: C5, vix_low: 15.0, vix_high: 25.0, trend_min: -0.03}
completion_cells:
  - {id: C06, vix_low: 12.0, vix_high: 22.0, trend_min: -0.05}
  - {id: C07, vix_low: 12.0, vix_high: 22.0, trend_min: -0.03}
  - {id: C08, vix_low: 12.0, vix_high: 28.0, trend_min: -0.05}
  - {id: C09, vix_low: 12.0, vix_high: 28.0, trend_min: -0.03}
  - {id: C10, vix_low: 12.0, vix_high: 25.0, trend_min: -0.03}
  - {id: C11, vix_low: 18.0, vix_high: 22.0, trend_min: -0.05}
  - {id: C12, vix_low: 18.0, vix_high: 22.0, trend_min: -0.03}
  - {id: C13, vix_low: 18.0, vix_high: 28.0, trend_min: -0.05}
  - {id: C14, vix_low: 18.0, vix_high: 28.0, trend_min: -0.03}
  - {id: C15, vix_low: 18.0, vix_high: 25.0, trend_min: -0.03}
  - {id: C16, vix_low: 15.0, vix_high: 22.0, trend_min: -0.03}
  - {id: C17, vix_low: 15.0, vix_high: 28.0, trend_min: -0.03}
fixed_policy_constants: from configs/choice_agent/g1.yaml verbatim
initial_cash: 100000.0  # fixed (isolates threshold effects; H0 covered capital)
windows:
  W1: {start: "2020-01-01", end: "2020-09-30", role: G1-A-equivalent-reproduction}
  W2: {start: "2021-07-01", end: "2022-03-31", role: VIX-selected-transition-window}
  W2X: {start: "2022-01-01", end: "2022-06-30", applies_to: [K2, K3],
    role: K2/K3-only TEST-third extension (quarter-aligned, pre-declared)}
  W2E: {start: "2021-07-01", end: "2022-06-30",
    role: K2/K3-only execution window (W2 plus Q2 extension)}
splits:
  rule: within-window chronological thirds by session date, pooled across windows (I1 thirds, UNMOVED)
  W1_T1: {start: "2020-01-01", end: "2020-03-31"}
  W1_T2: {start: "2020-04-01", end: "2020-06-30"}
  W1_T3: {start: "2020-07-01", end: "2020-09-30"}
  W2_T1: {start: "2021-07-01", end: "2021-09-30"}
  W2_T2: {start: "2021-10-01", end: "2021-12-31"}
  W2_T3: {start: "2022-01-01", end: "2022-03-31"}
  W2_T3X: {start: "2022-01-01", end: "2022-06-30", applies_to: [K2, K3]}
  TRAIN: [W1_T1, W2_T1]
  VALID: [W1_T2, W2_T2]
  TEST: [W1_T3, W2_T3]
  TEST_X: [W1_T3, W2_T3X]
candidates:
  K0: {cells: [C0, C1, C2, C3, C4, C5], windows: [W1, W2], test: TEST, role: "calibration-reference (must reproduce I1 46/19/18)"}
  K1: {cells: [C0, C1, C2, C3, C4, C5, C06, C07, C08, C09, C10, C11, C12, C13, C14, C15, C16, C17], windows: [W1, W2], test: TEST, role: "preferred (windows/splits/dates identical to I1)"}
  K2: {cells: [C0, C1, C2, C3, C4, C5], windows: [W1, W2E], test: TEST_X, role: "fallback-only (changes TEST population)"}
  K3: {cells: [C0, C1, C2, C3, C4, C5, C06, C07, C08, C09, C10, C11, C12, C13, C14, C15, C16, C17], windows: [W1, W2E], test: TEST_X, role: fallback-only}
selection_rule:
  order: [K1, K3, K2]  # K0 is calibration reference, never the winner
  eligibility: "ALL support gates pass"
  pick: "first eligible candidate in order (K1 preferred)"
  constraint: "K2/K3 considered ONLY if K1 fails the frozen gate"
cluster_unit: (window, market date)
action_taxonomy: {BUY: all-submitted-BUY, SELL: all-submitted-SELL, MIXED: both, HOLD: empty}
paired_contrast: (window, date) cluster where >= 2 executed cells disagree in action class
regime_label: per-date VIX band under frozen C0 bands (LOW <15, MID 15..25, HIGH >25)
gates:
  min_paired_contrast_train: 15
  min_paired_contrast_valid: 10
  min_paired_contrast_test: 20
  min_shared_action_regimes: 2
  min_contrast_instruments: 3
  min_second_window_contrasts: 10
  require_action_overlap_per_split: true
  require_bit_identical_rerun: true
  shared_pair_across_splits: true
  single_pair_watch: if TEST passes count but contains only ONE behavioural pair, STOP and consult human before mining (no automatic mining)
miner_frozen:
  invoke: only on frozen winner AND only under separate mining authorisation
  min_train_n: 15
  min_train_delta: 0.02
  max_candidates: 5
  permutation_seed: 20260926
  primary_target: adverse_mae
  secondary_target: adverse_forward_3d
  adverse_band: 0.01
failure_taxonomy: [F-ACC, F-CONC, F-CASH, F-VOL]
falsification: [real>perm count+delta, VALID n>=5, TEST confirmation, cross-instrument, cross-window transfer, no missingness artefact, deterministic rerun, suppression-vs-quality]
y_firewall:
  forbidden_before_freeze: [attribution engine, conditional miner, LearnedContext, MemoryStore, repair, MAE, forward returns, PnL, Sharpe, failure labels, mined conditions]
  enforcement: I2 runner/audit code must not import evaluation.attribution, evaluation.ml, evaluation.context; import test fails closed
stop_conditions:
  - no candidate passes all gates -> I2-NULL / SUPPORT-FAIL, terminal (no I3)
  - passing requires outcome-dependent selection -> STOP
  - any frozen path requires modification -> STOP
  - new threshold value / agent-logic change / learned-stochastic policy required -> STOP
  - Y-firewall breach -> STOP
  - miner on frozen winner finds nothing -> I2-NULL, terminal (no I3 variant hunt)
  - TEST count-pass with single pair -> STOP and consult (no automatic mining)
rationale: outcome-blind support construction; cell values all pre-registered in I1; window extension pre-declared on VIX-only facts; selection deterministic and Y-free
