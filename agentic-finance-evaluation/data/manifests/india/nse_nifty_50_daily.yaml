notes: "[nse_nifty_50_daily] Manually acquired NSE NIFTY 50 historical index data\
  \ (29 annual CSVs, 1997-11-03 to 2026-09-11). Raw files are immutable evidence under\
  \ data/raw/india/indices/ (UTF-8 with BOM, header 'Date,Open,High,Low,Close,Shares\
  \ Traded,Turnover (\u20B9 Cr)', descending date order). Total raw rows=7203 across\
  \ 29 files; unique dates=7183; canonical rows=7183 after deduplicating 20 proven\
  \ identical annual-boundary observations (1998-11-03, 1999-11-03, 2000-11-03 ...\
  \ 2025-11-03; 8 of 28 boundaries had no shared date due to weekend gaps). Conflicting\
  \ overlaps=0; schema validation passed (0 malformed/null rows, 0 numeric failures,\
  \ 0 OHLC violations, 0 negative prices/volumes/turnovers, 0 within-file duplicate\
  \ dates); canonical dataset is ascending by date, duplicate-free, mapped per-observation\
  \ to raw source file(s) via source_files column. Leakage: price-frame audit clean\
  \ (0 confirmed, 0 unresolved; 1 POTENTIAL CORPORATE_ACTION_UNVERIFIED which is not\
  \ applicable to an index level and does not mark leakage clean=false); agent-facing\
  \ simulation must filter observations by date<=t (no availability_date beyond observation\
  \ date exists; future prices/returns must remain inaccessible; evaluation labels\
  \ may use future internally without leaking to observations). Calendar: authoritative\
  \ NSE holiday artifact covers 2026 only (nse_trading_holidays_2026.json); historical\
  \ calendar completeness for 1997-2025 cannot be established and must not be inferred\
  \ from modern calendars or weekdays; coverage audit reports calendar UNAVAILABLE\
  \ for this period. Eligibility: VALIDATED_BUT_BLOCKED (manifest eligibility_status=blocked)\
  \ \u2014 dataset is acquired and schema-validated but remains blocked for experiments\
  \ pending (a) historical NSE calendar coverage, and (b) common intersection with\
  \ the other 10 mandatory datasets (only NIFTY 50 + 2026 calendar are acquired; VIX,\
  \ NIFTY 500, G-Sec, USD/INR, gold, CPI, IIP, policy remain pending). Do not mark\
  \ experiment-eligible merely because files exist."
