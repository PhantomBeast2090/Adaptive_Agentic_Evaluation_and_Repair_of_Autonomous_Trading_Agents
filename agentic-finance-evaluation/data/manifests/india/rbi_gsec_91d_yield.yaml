notes: '[rbi_gsec_91d_yield] RBI ''50 Macroeconomic Indicators'' workbook, Weekly
  sheet, exact series ''91-Day Treasury Bill (Primary) Yield (%)'' (465 Friday weeks,
  2017-10-13 to 2026-09-04). Raw workbook is immutable evidence under data/raw/india/fixed_income/,
  shared with the 10Y milestone (same bytes/SHA; explicitly recorded as a shared artifact,
  not a new acquisition). Definition: 91-day GoI Treasury Bill primary-market auction
  cut-off (implicit YTM) yield in % p.a.; weekly event frequency (91-day bills auction
  weekly, Wednesdays; week-ending Friday publication row). No secondary-market or
  SGL-transaction substitution. Total raw rows=465; canonical rows=458 after excluding
  7 RBI ''-'' placeholder weeks with documented reasons: 2023-03-31 (RBI non-observation
  placeholder (''-'' in source); 2024-09-20 (RBI non-observation placeholder (''-''
  in source); 2024-09-27 (RBI non-observation placeholder (''-'' in source); 2025-02-21
  (RBI non-observation placeholder (''-'' in source); 2026-01-02 (RBI non-observation
  placeholder (''-'' in source); 2026-03-27 (RBI non-observation placeholder (''-''
  in source); 2026-04-03 (RBI non-observation placeholder (''-'' in source). Independently
  confirmed non-observations include the 25-Mar-2026 and 21-Feb-2025 all-bids-rejected
  auction weeks; remaining dashes are RBI no-publication weeks with no cause invented.
  Conflicting overlaps=0 (single source); schema validation: header exact, 0 malformed/null
  rows, 0 numeric failures, 0 non-positive yields, 0 within-file duplicates, all Periods
  Fridays. Gaps above weekly cadence only at excluded weeks (14-day x3, 21-day x2);
  never filled or interpolated. Canonical dataset is ascending by observation date,
  duplicate-free, tenor 91D, with per-observation source_files provenance; weekly
  event observations never converted to daily. Leakage: price-frame audit clean (0
  confirmed, 0 unresolved; 1 POTENTIAL CORPORATE_ACTION_UNVERIFIED not applicable
  to a T-Bill yield); no publication_date supplied so none recorded. Agent boundary
  is the observation (week-ending) date; future yields must remain inaccessible; evaluation
  labels may use future internally without leaking. Calendar: authoritative NSE holiday
  artifact covers 2026 only; historical calendar completeness cannot be established
  and must not be inferred from weekdays or Wednesdays; coverage audit reports calendar
  UNAVAILABLE. Eligibility: VALIDATED_BUT_BLOCKED (manifest eligibility_status=blocked)
  pending (a) historical calendar coverage and (b) common intersection with the other
  mandatory datasets. Do not mark experiment-eligible merely because files exist.'
