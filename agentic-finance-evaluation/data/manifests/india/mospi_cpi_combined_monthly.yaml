notes: '[mospi_cpi_combined_monthly] MoSPI/NSO All-India CPI Combined General index, base 2012=100,
  index-only (no YoY inflation column; derivable later), January 2013 to December 2025 (156 months, homogeneous
  2012-base window). Raw evidence: 111 files under data/raw/india/macro/cpi/ — 106 MoSPI press-release PDFs (82
  base-2012 releases spanning 2015-2025 plus the Jan-2026 first-2024-base release carrying Dec-2025 FINAL 2012-base
  values, and 24 base-2010 releases kept as pre-homogeneous semantic evidence whose values are never canonicalized),
  4 PIB-mirrored MoSPI releases for Jul-Oct 2025 (MoSPI UUID URLs unrecoverable; mirrored content identical), and
  1 PIB release page (HTML) for Aug-2025 with official Posted-On timestamp. Values backbone: Annexure VI time series
  in CPI_Dec2025.pdf (156 months). Canonical rows=209: 82 provisional (rev 0), 82 final (rev 1, kept per-evidence so a
  month retains its final even without a release of its own, e.g. 2020-02 from the March-2020 release), 2 imputed
  Apr/May-2020 lockdown values published 2020-07-13 (rev 0), 23 revision-back-series 2013-01..2014-11 with documented
  2015-02-12 revision-release availability (contemporaneous releases were base-2010; Dec-2014 additionally carries a
  final vintage from the Jan-2015 revision release; never silently back-dated beyond the sourced revision release), 20
  final_series_only backbone rows with NULL availability (agent-ineligible, fail-closed). 0 value conflicts (finals match Annexure VI within 0.011; provisionals within
  0.6). Genuine revisions preserved (e.g. Jan-2025 prov 193.5 -> final 193.4; Jul-2025 prov 196.0 -> final 196.1). Known
  residual notes: Mar-2020 final never published (no Apr-2020 release; Annexure VI 148.6 vs prov 148.7 documented, prov retained);
  Jun-2019 present in MoSPI series (142.9; RBI workbook omission not replicated); Dec-2025 final 198.0 equals provisional;
  Sep/Nov/Dec-2022 dual-upload PDFs deduplicated (identical content, provenance merged). Release-time embargoes (5:30pm/4pm)
  recorded at date granularity only; no intraday precision invented. RBI workbook Monthly CPI 2012-col cross-check: 98 overlap
  months, max abs diff 0.1 (Mar-2020 case above), corroborating MoSPI values. Leakage: InformationSet boundary verified
  (availability <= t, latest eligible vintage); 6-case leakage suite green. Calendar: monthly periods need no trading calendar;
  common intersection still incomplete. Eligibility: VALIDATED_BUT_BLOCKED pending (a) historical calendar coverage and (b)
  common intersection. Do not mark experiment-eligible merely because files exist.'
