notes: '[nse_nifty_500_daily] Manually acquired NSE NIFTY 500 historical daily data
  (30 annual CSVs, 1996-11-04 to 2026-09-11) from the official NSE historical index
  data interface, colocated with NIFTY 50 files under data/raw/india/indices/ (no
  new directory structure). Raw files are immutable evidence (UTF-8, no BOM, RFC-4180
  quoted header ''Index Name,Date,Open,High,Low,Close'', date format ''DD Mon YYYY'',
  descending order; every row verified Index Name=''NIFTY 500''; no volume/turnover
  supplied by NSE for these exports and none fabricated). Total raw rows=7442 across
  30 files; canonical rows=7413 after deduplicating 21 proven identical annual-boundary
  observations (1997-11-03, 1998-11-03 ... 2025-10-28) and excluding 8 invalid rows:
  30 Dec 2002 in NIFTY 500_Historical_PR_02112002to02112003.csv (impossible OHLC relationship);
  14 May 2004 in NIFTY 500_Historical_PR_02112003to01112004.csv (impossible OHLC relationship);
  27 Apr 2004 in NIFTY 500_Historical_PR_02112003to01112004.csv (impossible OHLC relationship);
  04 Mar 1997 in NIFTY 500_Historical_PR_03111996to03111997.csv (missing OHLC (''-''
  placeholder in source)); 03 Mar 1997 in NIFTY 500_Historical_PR_03111996to03111997.csv
  (missing OHLC (''-'' placeholder in source)); 21 Nov 1998 in NIFTY 500_Historical_PR_03111998to03111999.csv
  (missing OHLC (''-'' placeholder in source)); 18 May 2009 in NIFTY 500_Historical_PR_31102008to31102009.csv
  (impossible OHLC relationship); 29 Apr 2009 in NIFTY 500_Historical_PR_31102008to31102009.csv
  (impossible OHLC relationship). Conflicting overlaps=0; schema validation: 0 malformed/null
  rows, 0 within-file duplicates, Change n/a (not supplied). Max calendar-day gap
  8 (1996-12-24 to 1997-01-01, Christmas/New Year week; no authoritative calendar
  to verify, not inferred as holiday). Canonical dataset is ascending by date, duplicate-free,
  mapped per-observation to raw source file(s) via source_files column. Leakage: price-frame
  audit clean (0 confirmed, 0 unresolved; 1 POTENTIAL CORPORATE_ACTION_UNVERIFIED
  not applicable to an index level); agent-facing simulation must filter observations
  by date<=t (no availability_date beyond observation date exists; future prices/returns
  must remain inaccessible; evaluation labels may use future internally without leaking).
  Calendar: authoritative NSE holiday artifact covers 2026 only; historical calendar
  completeness for 1996-2025 cannot be established and must not be inferred; coverage
  audit reports calendar UNAVAILABLE. This is an index-level series, not a security-level
  constituent universe; no constituent histories are fabricated. Eligibility: VALIDATED_BUT_BLOCKED
  (manifest eligibility_status=blocked) pending (a) historical NSE calendar coverage
  and (b) common intersection with the other mandatory datasets. Do not mark experiment-eligible
  merely because files exist.'
