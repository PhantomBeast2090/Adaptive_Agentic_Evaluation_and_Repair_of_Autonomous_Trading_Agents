notes: '[nse_india_vix_daily] Manually acquired NSE India VIX historical data (17
  annual CSVs, 2010-07-19 to 2026-09-11) from the official NSE Historical Data - India
  VIX page. Raw files are immutable evidence under data/raw/india/india_vix/ (UTF-8
  with BOM, header ''Date,Open,High,Low,Close,Prev. Close,Change,% Change'' with sixth
  column ''Prev. Close'', ascending date order). Total raw rows=4019 across 17 files;
  unique valid dates after exclusions=4004; canonical rows=4004 after deduplicating
  12 proven identical annual-boundary observations (2010-11-03, 2011-11-03, 2013-11-03
  ... 2025-11-03) and excluding 3 invalid rows: 22-AUG-2013 in hist_india_vix_-03-11-2012-to-03-11-2013.csv
  (impossible OHLC relationship); 12-FEB-2021 in hist_india_vix_-03-11-2020-to-03-11-2021.csv
  (non-finite value (inf or NaN)); 30-MAR-2021 in hist_india_vix_-03-11-2020-to-03-11-2021.csv
  (non-finite value (inf or NaN)). Conflicting overlaps=0; schema validation: 0 malformed/null
  rows, 0 numeric failures, 0 within-file duplicates, Change/% Change consistent with
  Close-Prev.Close within rounding (0 failures); 3 rows excluded as documented (22-AUG-2013
  close<low; 12-FEB-2021 and 30-MAR-2021 zero-filled OHLC with NaN % Change placeholders).
  First annual file covers 2010-07-19 to 2010-11-03 only (77 rows) despite its 2009-to-2010
  name: earliest available VIX observation is 2010-07-19, earlier history not supplied.
  Canonical dataset is ascending by date, duplicate-free, mapped per-observation to
  raw source file(s) via source_files column. Leakage: price-frame audit clean (0
  confirmed, 0 unresolved; 1 POTENTIAL CORPORATE_ACTION_UNVERIFIED not applicable
  to a volatility index); agent-facing simulation must filter observations by date<=t
  (no availability_date beyond observation date exists; future VIX/returns must remain
  inaccessible; evaluation labels may use future internally without leaking). Calendar:
  authoritative NSE holiday artifact covers 2026 only; historical calendar completeness
  for 2010-2025 cannot be established and must not be inferred; coverage audit reports
  calendar UNAVAILABLE. Eligibility: VALIDATED_BUT_BLOCKED (manifest eligibility_status=blocked)
  pending (a) historical NSE calendar coverage and (b) common intersection with the
  other mandatory datasets. Do not mark experiment-eligible merely because files exist.'
