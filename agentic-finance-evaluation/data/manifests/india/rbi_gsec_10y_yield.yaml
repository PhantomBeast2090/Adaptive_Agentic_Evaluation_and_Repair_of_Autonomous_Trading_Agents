notes: "[rbi_gsec_10y_yield] RBI '50 Macroeconomic Indicators' workbook, Weekly sheet,\
  \ exact series '10-Year G-Sec Yield (FBIL) (%)' (465 Friday-ending weeks, 2017-10-13\
  \ to 2026-09-04). Raw workbook is immutable evidence under data/raw/india/fixed_income/\
  \ (103038 bytes; sheets Weekly/Fortnightly/Monthly/Quarterly, only Weekly target\
  \ series used; Period in column B, series in column M; workbook creator SERVER,\
  \ created 2026-09-12). Definition: RBI-republished FBIL-derived 10Y G-Sec valuation\
  \ yield in % p.a. (FBIL cubic-spline G-Sec valuation benchmarks, 10Y an important\
  \ input tenor) \u2014 a fixed-income market-state variable; not an auction cut-off\
  \ and not a single-security price. Rejected alternative: Investing.com 'India 10-Year\
  \ Bond Yield Historical Data.csv' (tertiary aggregator, stale to 2017-03, redistribution\
  \ prohibited) \u2014 never used. Total raw rows=465; canonical rows=465 (0 excluded,\
  \ 0 duplicates, single source so no overlaps). Schema validation: header exact,\
  \ 0 malformed/null rows, 0 numeric failures, 0 non-positive yields (range 5.7268-8.0732),\
  \ 0 within-file duplicates, all Periods Fridays, perfect 7-day cadence (464 intervals,\
  \ 0 gaps above threshold). Frequency corrected weekly (manifest previously assumed\
  \ daily; the RBI weekly table is the authoritative frequency and no daily observation\
  \ is claimed). Canonical dataset is ascending by observation date, duplicate-free,\
  \ with per-observation source_files provenance; weekly observations never converted\
  \ to daily, forward-filled, or interpolated; no pre-2017 splice from any other source.\
  \ Leakage: price-frame audit clean (0 confirmed, 0 unresolved; 1 POTENTIAL CORPORATE_ACTION_UNVERIFIED\
  \ not applicable to a sovereign yield); no publication_date supplied in workbook\
  \ so none recorded \u2014 agent boundary is the observation (week-ending) date;\
  \ future yields must remain inaccessible; evaluation labels may use future internally\
  \ without leaking. Calendar: authoritative NSE holiday artifact covers 2026 only;\
  \ historical calendar completeness cannot be established and must not be inferred\
  \ from weekdays; coverage audit reports calendar UNAVAILABLE. Redistribution: RBI-published\
  \ public macro statistics retained with Source RBI attribution; no contractual redistribution\
  \ prohibition analogous to FBIL-gated or Investing.com ToS was found \u2014 attribution\
  \ retained in manifest and canonical source field. Eligibility: VALIDATED_BUT_BLOCKED\
  \ (manifest eligibility_status=blocked) pending (a) historical calendar coverage\
  \ and (b) common intersection with the other mandatory datasets. Do not mark experiment-eligible\
  \ merely because files exist."
