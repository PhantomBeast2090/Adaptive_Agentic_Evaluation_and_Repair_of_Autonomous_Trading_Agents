notes: '[mospi_iip_general_monthly] MoSPI/NSO All-India IIP General Index level, base 2011-12=100,
  index-only (no YoY growth column; derivable later), April 2012 to March 2026 (168 consecutive months, homogeneous
  2011-12 window; FY2011-12 monthly data never published on this base, nothing spliced). Raw evidence: 132 files under
  data/raw/india/macro/iip/ — monthly Quick Estimates press releases (MoSPI PDFs plus PIB mirrors/pages where MoSPI URLs
  unrecoverable), the May-2017 base-revision release with the official 60-month back-series (Apr-2012..Mar-2017), the joint
  May-2017 base-revision statement, the IIP methodology manual, 25 base-2004-05 releases kept as pre-homogeneous semantic
  evidence (values never canonicalized), and one 2022-23-base release kept evidence-only (new series from Apr-2026, never
  canonicalized). Canonical rows=345: 89 quick (rev 0), 70 first_revision (rev 1), 81 final (rev 2), 60 back_series (rev 0,
  available 2017-05-12), 45 republished (rev sequential, first-seen availability). Vintage model is empirical per release:
  classic releases carry QE(M)+R1(M-1)+Final(M-3); new-format releases (2025+, 28th schedule) finalize M-1 (sometimes M-1..M-3
  at schedule transitions, e.g. Mar-2025); whatever is stated is recorded, never assumed. 0 value conflicts (QE text matches
  Statement I QE-month values in every parseable release); 10 named-but-unvalued early-2017 revisions preserved without
  fabricated values (months remain covered by back-series and later republications). Genuine revisions preserved (e.g. Jan-2023
  146.5->146.9->147.4 across Mar/Apr/Dec-2023 releases; Jul-2025 155.0->156.2). 168/168 months carry verified availability.
  COVID: Apr-2020 QE 56.3 published 2020-06-12 with explicit non-comparability notes (hash-marked rows); lockdown months revised
  normally thereafter (e.g. Apr-2020 final 54.0 in Jul-2020 release). RBI workbook Monthly IIP corroboration: exact match
  (ratio 1.000) Oct-2017..Mar-2023, then an unexplained RBI-side level rescaling (~0.86 from Apr-2023, ~0.72 Jan-2026) with
  direction preserved (mom-growth corr 0.98); MoSPI-direct canonical stands, RBI never used for values. Release schedule moved
  12th->28th during 2025 (first 28th release May-28-2025 for Apr-2025); embargo times kept at date granularity. Leakage:
  InformationSet boundary verified (availability <= t, latest eligible vintage); 6-case leakage suite green. Calendar: monthly
  periods need no trading calendar; common intersection still incomplete. Eligibility: VALIDATED_BUT_BLOCKED pending (a)
  historical calendar coverage and (b) common intersection. Do not mark experiment-eligible merely because files exist.'
