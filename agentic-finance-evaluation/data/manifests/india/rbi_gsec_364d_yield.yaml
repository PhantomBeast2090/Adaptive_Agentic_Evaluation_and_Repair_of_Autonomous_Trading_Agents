  shared with the 10Y and 91D milestones (same bytes/SHA; explicitly recorded as a shared
  artifact, not a new acquisition). Definition: 364-day GoI Treasury Bill primary-market
  auction cut-off (implicit YTM) yield in % p.a.; weekly event frequency (week-ending
  Friday publication row). No secondary-market or SGL-transaction substitution. Total
  raw rows=465; canonical rows=459 after excluding 6 RBI ''-'' placeholder weeks with
  documented reasons: 2024-09-20 (RBI non-observation placeholder (''-'' in source);
  2024-09-27 (RBI non-observation placeholder (''-'' in source); 2026-01-02 (RBI non-observation
  placeholder (''-'' in source); 2026-03-27 (RBI non-observation placeholder (''-''
  in source); 2026-04-03 (RBI non-observation placeholder (''-'' in source); 2026-06-05
  (RBI non-observation placeholder (''-'' in source). No cause beyond the source placeholder
  is invented. Conflicting overlaps=0 (single source); schema validation: header exact,
  0 malformed/null rows, 0 numeric failures, 0 non-positive yields, 0 within-file duplicates,
  all Periods Fridays. Gaps above weekly cadence only at excluded weeks (14-day x2,
  21-day x2); never filled or interpolated. Canonical dataset is ascending by observation
  date, duplicate-free, tenor 364D, with per-observation source_files provenance; weekly
  event observations never converted to daily. Leakage: price-frame audit clean (0 confirmed,
  0 unresolved); no publication_date supplied so none recorded. Agent boundary is the
  observation (week-ending) date; future yields must remain inaccessible; evaluation labels
  may use future internally without leaking. Calendar: authoritative NSE holiday artifact
  covers 2026 only; historical calendar completeness cannot be established and must not
  be inferred from weekdays; coverage audit reports calendar UNAVAILABLE. Eligibility:
  VALIDATED_BUT_BLOCKED (manifest eligibility_status=blocked) pending (a) historical calendar
  coverage and (b) common intersection with the other mandatory datasets. Do not mark
  experiment-eligible merely because files exist.'
