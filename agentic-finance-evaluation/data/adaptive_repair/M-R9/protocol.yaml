    - GOLDAUG2023
    nse_equity:
    - YESBANK:EQ
    - ICICIBANK:EQ
    - RELIANCE:EQ
    - SBIN:EQ
    - INFY:EQ
    - TCS:EQ
  vintage_policy: explicit
episode_budget:
  max_campaign_total: 240
  max_per_experiment: 40
