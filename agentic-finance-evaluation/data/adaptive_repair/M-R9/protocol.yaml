    baseline run); the E2-F run_repair ledger is inapplicable here. Runner refuses
    held-out/validation stages when exhausted.
experiment_id: M-R9
label: MULTI-MECHANISM-MULTI-WINDOW-CAMPAIGN
mechanism_templates:
  drawdown:
    scope_hint: {}
    taxonomy: drawdown
    trigger_hint:
    - - drawdown
      - gt
      - 0.05
  exposure:
    scope_hint: {}
    taxonomy: exposure
    trigger_hint: []
  loss_chasing:
    scope_hint: {}
    taxonomy: loss-chasing
    trigger_hint: []
  overtrading:
    scope_hint: {}
    taxonomy: overtrading
    trigger_hint: []
  volatility:
    scope_hint: {}
    taxonomy: volatility
    trigger_hint:
    - - vix
      - gt
      - 25.0
multiplicity:
  method: disclosure-only
  note: report experiment/candidate/mechanism counts with all CIs; ADMISSIBLE only
    on frozen-gate passes, else at most PROMISING DIAGNOSTIC SIGNAL. No correction
    claimed, none shopped.
negative_controls:
- expect: REJECT
  family: block_action
  params:
    side: SELL
- expect: REFUSE-OR-REJECT
  family: hold_all
  params: {}
- expect: REJECT
  family: per_session_order_cap
  params:
    max_orders: 0
normal_bound:
  kind: vix_calm_regime
  normal_quantity: 2.0
  vix_high: 25.0
normality:
  adjudication: MECHANISM_RELATIVE_GENERALIZED
  exposure_normal_names: 2
  sensitivity: N0_VIX_CALM_REGIME
replication_support_gate:
  min_high_action_sessions: 8
stopping_rule: exactly the six frozen triples, then STOP
target:
  aggregate: block_excess
  block_size: 10
  direction: decrease
  normal_quantity: 2.0
